---
#  https://github.com/crc-org/crc-cloud/blob/main/pkg/bundle/setup/clustersetup.sh#L229
- name: Ensure htpasswd.txt does not exists
  ansible.builtin.file:
    path: htpasswd.txt
    state: absent

- name: Create temporary directory
  ansible.builtin.tempfile:
    state: directory
  register: _temp_dir

- name: Create Dockerfile
  ansible.builtin.copy:
    content: |
      FROM quay.io/centos/centos:stream9-minimal
      RUN microdnf --setopt=tsflags=nodocs --setopt=install_weak_deps=0 install -y httpd-tools
      ENTRYPOINT ["htpasswd", "-Bbn"]
    dest: "{{ _temp_dir.path }}/Dockerfile"

- name: Build container image for htpasswd
  ansible.builtin.command: |
    podman build -t localhost/htpasswd:latest -f {{ _temp_dir.path }}/Dockerfile

- name: Get htpasswd
  ansible.builtin.include_tasks: get_htpasswd.yaml
  loop: "{{ users }}"
  loop_control:
    loop_var: user
  no_log: true

- name: Cleanup htpasswd.txt file
  ansible.builtin.shell: |
    sed -i '/^\s*$/d' htpasswd.txt

- name: Create secret with generic htpass-secret
  ansible.builtin.shell: >
    oc create secret generic htpass-secret
    --from-file=htpasswd=htpasswd.txt
    -n openshift-config
    --dry-run=client
    -o yaml > /tmp/htpass-secret.yaml

- name: Replace htpass-secret
  ansible.builtin.command: oc replace -f /tmp/htpass-secret.yaml

- name: Remove temporary directory
  ansible.builtin.file:
    path: "{{ _temp_dir.path }}"
    state: absent
